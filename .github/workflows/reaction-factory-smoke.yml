name: Reaction Factory Smoke Test

on:
  push:
    paths:
      - '.github/workflows/reaction-factory-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  smoke-test:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: fb-reaction-factory

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python requirements
        run: python -m pip install -r requirements.txt

      - name: Prepare FFmpeg with text support
        shell: bash
        run: |
          FFMPEG_BIN="$(command -v ffmpeg || true)"
          if [ -z "$FFMPEG_BIN" ] || ! "$FFMPEG_BIN" -filters 2>/dev/null | grep -q drawtext; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends ffmpeg fontconfig fonts-dejavu-core
            hash -r
            FFMPEG_BIN="$(command -v ffmpeg)"
          fi
          "$FFMPEG_BIN" -filters | grep -q drawtext
          echo "REACTION_FACTORY_FFMPEG=$FFMPEG_BIN" >> "$GITHUB_ENV"
          echo "FFmpeg ready: $FFMPEG_BIN"

      - name: Get private cloud worker identity
        shell: bash
        run: |
          TOKEN_JSON="$(curl -fsSL -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=reaction-factory-cloud")"
          TOKEN="$(printf '%s' "$TOKEN_JSON" | python -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          echo "::add-mask::$TOKEN"
          echo "REACTION_FACTORY_CLOUD_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Test real download edit and metadata without posting
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from cloud_sync import pull_reactions, pull_state
          from autopilot import load_state
          from auto_pipeline import clean_caption_seed, download_url, source_context_from_url
          from reaction_factory import ffprobe_duration, make_reel
          from metadata import generate_metadata

          pull_reactions()
          pull_state()
          state = load_state()
          url = str(state.get('last_url') or '').strip()
          if not url:
              raise RuntimeError('No last dashboard URL is available for the smoke test.')

          print('SMOKE: queued URL found')
          source = Path(download_url(url))
          duration = ffprobe_duration(source)
          print(f'SMOKE: download passed ({duration:.1f}s)')

          seed = source_context_from_url(url) or clean_caption_seed(source)
          output, _reaction = make_reel(
              str(source), caption=seed, reaction='auto', rights_ok=True, middle_banner=True
          )
          output = Path(output)
          if not output.exists() or output.stat().st_size <= 0:
              raise RuntimeError('Reaction edit output was not created.')
          print(f'SMOKE: 30/70 edit + small Droxion banner passed ({output.stat().st_size} bytes)')

          metadata = generate_metadata(seed)
          if not metadata.get('title') or not metadata.get('hashtags'):
              raise RuntimeError('Title/tags generation failed.')
          print('SMOKE: title + tags passed')
          print('SMOKE SUCCESS: download -> edit -> title/tags all passed; posting was intentionally skipped.')
          PY

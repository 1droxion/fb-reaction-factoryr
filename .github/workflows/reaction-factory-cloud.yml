name: Reaction Factory Cloud

on:
  workflow_dispatch:
  push:
    paths:
      - 'fb-reaction-factory/data/post_now.trigger'
  schedule:
    - cron: '*/5 * * * *'

concurrency:
  group: reaction-factory-cloud
  cancel-in-progress: false

jobs:
  autopilot:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: fb-reaction-factory
    env:
      META_PAGE_ID: '1213992321791402'
      META_IG_USER_ID: '17841406232043396'
      META_IG_USERNAME: 'dhruv6x8'
      META_GRAPH_VERSION: 'v26.0'
      META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
      META_USER_ACCESS_TOKEN: ${{ secrets.META_USER_ACCESS_TOKEN }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
      YOUTUBE_COOKIES_FILE: ${{ runner.temp }}/reaction-factory-youtube-cookies.txt
      REACTION_FACTORY_FORCE_NOW: ${{ github.event_name == 'push' && '1' || '0' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python requirements
        run: python -m pip install -r requirements.txt

      - name: Prepare authenticated YouTube session
        shell: bash
        run: |
          mkdir -p "$HOME/.config/yt-dlp"
          if [ -n "${YOUTUBE_COOKIES:-}" ]; then
            printf '%s' "$YOUTUBE_COOKIES" > "$YOUTUBE_COOKIES_FILE"
            chmod 600 "$YOUTUBE_COOKIES_FILE"
            printf '%s\n' "--cookies $YOUTUBE_COOKIES_FILE" "--js-runtimes node" > "$HOME/.config/yt-dlp/config"
            echo "YouTube authenticated session enabled for all yt-dlp calls."
          else
            rm -f "$YOUTUBE_COOKIES_FILE" "$HOME/.config/yt-dlp/config"
            echo "YouTube cookies secret is not configured."
          fi

      - name: Validate and refresh Meta credentials
        run: python meta_preflight.py

      - name: Run cloud autopilot job
        run: python cloud_job.py

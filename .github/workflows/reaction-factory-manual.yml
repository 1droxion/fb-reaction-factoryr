name: Reaction Factory Live Worker

on:
  push:
    paths:
      - 'fb-reaction-factory/data/post_now.trigger'
      - 'fb-reaction-factory/cloud_daemon.py'
      - 'fb-reaction-factory/channel_dispatch.py'
      - 'fb-reaction-factory/channel_queue.py'
      - 'fb-reaction-factory/cloud_job.py'
      - 'fb-reaction-factory/cloud_multiplatform.py'
      - 'fb-reaction-factory/cloud_sync.py'
      - 'fb-reaction-factory/cloud_youtube_auth.py'
      - 'fb-reaction-factory/youtube_download.py'
      - 'fb-reaction-factory/requirements.txt'
      - 'fb-reaction-factory/instagram.py'
      - 'fb-reaction-factory/facebook.py'
      - 'fb-reaction-factory/youtube_short.py'
      - 'fb-reaction-factory/auto_pipeline.py'
      - 'fb-reaction-factory/instagram_download.py'
      - 'fb-reaction-factory/reaction_factory.py'
      - '.github/workflows/reaction-factory-manual.yml'
  schedule:
    - cron: '0 */5 * * *'
  workflow_dispatch:

concurrency:
  group: reaction-factory-live-worker
  cancel-in-progress: true

jobs:
  live-worker:
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    defaults:
      run:
        working-directory: fb-reaction-factory
    env:
      META_PAGE_ID: '1213992321791402'
      META_PAGE_ID_TVMIND: '1213992321791402'
      META_PAGE_ID_KIDS: ${{ secrets.META_PAGE_ID_KIDS }}
      META_IG_USER_ID: '17841406232043396'
      META_IG_USERNAME: 'dhruv6x8'
      META_GRAPH_VERSION: v26.0
      META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
      META_PAGE_ACCESS_TOKEN_TVMIND: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
      META_PAGE_ACCESS_TOKEN_KIDS: ${{ secrets.META_PAGE_ACCESS_TOKEN_KIDS }}
      META_USER_ACCESS_TOKEN: ${{ secrets.META_USER_ACCESS_TOKEN }}
      META_SYSTEM_USER_ACCESS_TOKEN_KIDS: ${{ secrets.META_SYSTEM_USER_ACCESS_TOKEN_KIDS }}
      YOUTUBE_TOKEN_JSON_TVMIND: ${{ secrets.YOUTUBE_TOKEN_JSON_TVMIND }}
      YOUTUBE_TOKEN_JSON_KIDS: ${{ secrets.YOUTUBE_TOKEN_JSON_KIDS }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      REACTION_FACTORY_FORCE_NOW: '1'
      REACTION_FACTORY_POLL_SECONDS: '10'
      REACTION_FACTORY_MAX_RUNTIME_SECONDS: '19800'
      REACTION_FACTORY_TIMEZONE: 'America/Chicago'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python requirements
        run: python -m pip install -r requirements.txt

      - name: Validate Meta credentials
        run: python meta_preflight.py

      - name: Run continuous dashboard worker
        run: python cloud_daemon.py
